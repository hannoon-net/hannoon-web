<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Hannoon Platform - Connecting...</title>
    <script>
        async function routeByIP() {
            try {
                // 무료 IP 위치 정보 API 호출
                let response = await fetch('https://ipapi.co/json/');
                let data = await response.json();
                let countryCode = data.country_code;

                // 한국 IP인 경우 /ko/ 폴더로 이동
                if (countryCode === 'KR') {
                    window.location.replace('./ko/');
                } else {
                    // 그 외 국가 IP인 경우 /en/ 폴더로 이동
                    window.location.replace('./en/');
                }
            } catch (error) {
                // API 차단이나 네트워크 오류 시 기본값으로 영어 또는 한국어 페이지로 안전하게 폴백(Fallback)
                console.error("IP 라우팅 실패, 기본 영문 페이지로 이동:", error);
                window.location.replace('./en/');
            }
        }

        // 실행
        routeByIP();
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 100px; font-family: sans-serif; color: #666;">
        Loading Hannoon Platform...
    </p>
</body>
</html>
