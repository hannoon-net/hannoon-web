출<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1c29 0%, #161a30 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            width: 85%;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #1a1c29;
            font-weight: 700;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(253, 160, 133, 0.4);
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 15px 0;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 14px;
            color: #a0aec0;
            line-height: 1.6;
            margin: 0 0 25px 0;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #fda085;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Coming Soon</div>
        <h1>새로운 서비스 준비 중</h1>
        <p>더 나은 모습과 완벽한 서비스로 찾아뵙기 위해<br>열심히 준비하고 있습니다. 조금만 기다려주세요!</p>
        <div class="spinner"></div>
    </div>
</body>
</html>
